<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Super Awesome Bootstrap Site</title>
  </head>
  <body>
    <!-- Nav bar -->
    <nav class="navbar navbar-expand-md bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">
          <i class="fa-solid fa-shield-cat fa-2xl"></i>
          Cat News
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="#">Cat News</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Local Dogwatch</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <!-- Main body content -->
    <main class="container my-5 d-flex flex-column gap-3">
      <div class="container-fluid">
        <form class="card mb-3">
          <div class="card-body">
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                value=""
                id="checkDefault"
              />
              <label class="form-check-label" for="checkDefault">
                Default checkbox
              </label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                value=""
                id="checkChecked"
                checked
              />
              <label class="form-check-label" for="checkChecked">
                Checked checkbox
              </label>
            </div>

            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="radioDefault"
                id="radioDefault1"
              />
              <label class="form-check-label" for="radioDefault1">
                Default radio
              </label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="radioDefault"
                id="radioDefault2"
              />
              <label class="form-check-label" for="radioDefault2">
                Default checked radio
              </label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="radioDefault"
                id="radioDefault3"
                checked
              />
              <label class="form-check-label" for="radioDefault3">
                Default checked radio
              </label>
            </div>
            <button class="btn btn-primary mt-2">Submit Form</button>
          </div>
        </form>

        <form class="card mb-3">
          <div class="card-body">
            <select
              class="form-select mb-2"
              aria-label="Default select example"
              name="favorite-cat"
            >
              <option selected>Choose your favorite cat:</option>
              <option value="grizelle">Grizelle</option>
              <option value="sombra">Sombra</option>
              <option value="none">I'm more of a dog person tbh.</option>
            </select>
            <button class="btn btn-primary">Submit Form</button>
          </div>
        </form>

        <!-- Horizontal buttons -->
        <form class="card mb-3" style="max-width: 30rem">
          <div class="card-body">
            <h5 class="card-title">Log In</h5>
            <div class="container-fluid d-flex flex-column gap-2">
              <input type="text" name="username" placeholder="username" />
              <input type="password" name="password" placeholder="password" />
              <div class="w-100 d-flex gap-2 justify-content-center">
                <button class="btn btn-primary">Log In</button>
                <button class="btn btn-secondary">Sign Up</button>
              </div>
            </div>
          </div>
        </form>
        <!-- Vertical layout -->
        <form class="card" style="max-width: 30rem">
          <div class="card-body">
            <h5 class="card-title">Log In</h5>
            <div class="container-fluid d-flex flex-column gap-2">
              <input type="text" name="username" placeholder="username" />
              <input type="password" name="password" placeholder="password" />
              <button class="btn btn-primary">Log In</button>
              <button class="btn btn-secondary">Sign Up</button>
            </div>
          </div>
        </form>
      </div>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
